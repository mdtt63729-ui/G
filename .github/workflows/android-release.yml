name: Android Release Build

# Manually triggered from the Actions tab ("Run workflow").
# Produces a release APK. If you want a *signed* release build, add the four
# repository secrets listed below; otherwise this still builds an unsigned
# release APK.
#
# Secrets to add (Settings > Secrets and variables > Actions), all optional:
#   KEYSTORE_BASE64      - `base64 -i your-release-key.jks | pbcopy` (or -w0 on Linux)
#   KEYSTORE_PASSWORD     - your store password
#   KEY_ALIAS             - your key alias
#   KEY_PASSWORD          - your key password

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

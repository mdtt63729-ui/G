name: Build GITOFY

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  debug-build:
    name: Debug APK - Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GITOFY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITOFY-ci-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14


  release-build:
    name: Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate temporary CI keystore
        run: |
          keytool -genkeypair \
            -alias gitofy-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$GITHUB_WORKSPACE/gitofy-ci.jks" \
            -storepass gitofy123 \
            -keypass gitofy123 \
            -dname "CN=GITOFY, OU=CI, O=GITOFY, L=Kolkata, ST=West Bengal, C=IN"

      - name: Configure CI signing
        run: |
          cat > keystore.properties <<EOF
          keyAlias=gitofy-ci
          keyPassword=gitofy123
          storeFile=$GITHUB_WORKSPACE/gitofy-ci.jks
          storePassword=gitofy123
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GITOFY-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
